<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CraftGlitch — Pannello addon</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000;--panel:#0c0718;--slot:#140b28;--line:#2a1a4d;
  --cyan:#19e6ff;--magenta:#e43bff;--violet:#7a2bff;--red:#ff4d6d;--ink:#f2f4ff;--muted:#a59cc6;
  --pixel:"Silkscreen",ui-monospace,monospace;--body:"Chakra Petch",system-ui,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--panel) 1px,transparent 1px),linear-gradient(90deg,var(--panel) 1px,transparent 1px);background-size:32px 32px}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
h1,h2{font-family:var(--pixel);font-weight:700;margin:0}
.btn{--bg:var(--cyan);--fg:#000;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;font:700 15px var(--body);color:var(--fg);background:var(--bg);border:0;cursor:pointer;text-decoration:none;
  clip-path:polygon(0 5px,5px 5px,5px 0,calc(100% - 5px) 0,calc(100% - 5px) 5px,100% 5px,100% calc(100% - 5px),calc(100% - 5px) calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,5px calc(100% - 5px),0 calc(100% - 5px))}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.mag{--bg:var(--magenta);--fg:#fff}
.btn.ghost{--bg:transparent;--fg:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--cyan)}
.btn.danger{--bg:transparent;--fg:var(--red);box-shadow:inset 0 0 0 2px #4a1a2a}
.btn.danger:hover{--bg:var(--red);--fg:#000}
.btn.sm{padding:7px 12px;font-size:14px}
.panel{background:var(--panel);border:2px solid var(--line)}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
#login .panel{width:min(400px,100%);padding:32px}
#login img{width:96px;margin:0 auto 16px;display:block;filter:drop-shadow(0 0 18px rgba(228,59,255,.5))}
#login h1{text-align:center;font-size:24px;margin-bottom:6px}
#login p{text-align:center;color:var(--muted);margin:0 0 24px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:13px}
input,textarea,select{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--slot);border:2px solid var(--line);padding:10px 12px;border-radius:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan)}
textarea{resize:vertical;min-height:84px}
.field{margin-bottom:16px}
.linkbtn{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:500 14px var(--body);cursor:pointer;text-decoration:underline}
.linkbtn:hover{color:var(--cyan)}
.linkbtn[hidden]{display:none}
.err{color:var(--red);font-size:14px;min-height:20px;margin:4px 0 12px}

/* app */
#app{display:none}
.top{border-bottom:1px solid var(--line);background:rgba(0,0,0,.85);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.top .who{display:flex;align-items:center;gap:12px}
.top img{width:36px}
.top h1{font-size:17px}
.top .acts{display:flex;gap:8px;align-items:center}
.top .mail{color:var(--muted);font-size:14px}
@media(max-width:640px){.top .mail{display:none}}

.layout{display:grid;grid-template-columns:420px 1fr;gap:24px;padding:28px 0 60px;align-items:start}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.editor{padding:24px}
@media(max-width:960px){.editor{position:static}}
.editor h2{font-size:20px;margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--cyan)}
.colors{display:flex;gap:8px}
.colors label{margin:0;cursor:pointer}
.colors input{position:absolute;opacity:0;width:1px;height:1px}
.colors span{display:block;width:40px;height:40px;border:3px solid transparent;box-shadow:inset 0 0 0 3px var(--void)}
.colors input:checked+span{border-color:var(--ink)}
.colors input:focus-visible+span{outline:3px solid var(--cyan);outline-offset:2px}
.form-acts{display:flex;gap:10px;margin-top:8px}
.form-acts .btn:first-child{flex:1}

.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.list-head h2{font-size:20px}
.stats{display:flex;gap:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink)}
.items{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto 56px 1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border-left:4px solid var(--c,var(--cyan))}
.item.hidden{opacity:.55}
.item.editing{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan)}
.slot{width:56px;height:56px;display:grid;place-items:center;font-size:28px;background:var(--slot);box-shadow:inset 3px 3px 0 #05020c,inset -3px -3px 0 #2c1c52}
.slot img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
.item h3{margin:0;font-size:18px;line-height:1.2}
.item .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.pill{font-family:var(--pixel);font-size:10px;padding:2px 6px;background:var(--slot);color:var(--ink)}
.price{font-family:var(--pixel);font-size:18px;white-space:nowrap}
.price.free{color:var(--cyan)}
.ord{display:grid;gap:2px}
.ord button{background:var(--slot);border:0;color:var(--muted);width:26px;height:22px;cursor:pointer;font-size:12px}
.ord button:hover{color:var(--cyan)}
.ord button:disabled{opacity:.25;cursor:default}
.item .acts{display:flex;gap:6px}
@media(max-width:620px){
  .item{grid-template-columns:56px 1fr;}
  .item .ord{display:none}
  .item .price,.item .acts{grid-column:2}
}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.empty .btn{margin-top:16px}
.uid{margin-top:24px;padding:16px;font-size:13px;color:var(--muted);word-break:break-all}
.uid code{color:var(--cyan);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 20px;background:var(--cyan);color:#000;font-weight:700;padding:12px 20px;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.bad{background:var(--red)}
.toast.show{opacity:1;translate:-50% 0}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="panel" id="loginForm">
    <img src="logo.png" alt="CraftGlitch">
    <h1 id="lTitle">Pannello addon</h1>
    <p id="lSub">Caricamento…</p>
    <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required minlength="6"></div>
    <div class="field" id="lPass2Wrap" hidden><label for="lPass2">Ripeti password</label><input id="lPass2" type="password" autocomplete="new-password" minlength="6"></div>
    <div class="err" id="lErr" role="alert"></div>
    <button class="btn" style="width:100%" id="lBtn" disabled>Accedi</button>
    <button class="linkbtn" type="button" id="lForgot" hidden>Password dimenticata?</button>
  </form>
</div>

<!-- APP -->
<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="who"><img src="favicon.png" alt=""><h1>Pannello addon</h1></div>
      <div class="acts">
        <span class="mail" id="who"></span>
        <a class="btn ghost sm" href="index.html" target="_blank" rel="noopener">Apri sito</a>
        <button class="btn ghost sm" id="logout">Esci</button>
      </div>
    </div>
  </header>

  <div class="wrap layout">
    <form class="panel editor" id="form" novalidate>
      <h2 id="formTitle">Nuovo addon</h2>
      <div class="row">
        <div class="field"><label for="fName">Nome</label><input id="fName" required maxlength="40"></div>
        <div class="field"><label for="fEmoji">Icona <span class="hint">(emoji)</span></label><input id="fEmoji" maxlength="8" placeholder="🧩"></div>
      </div>
      <div class="field"><label for="fImage">Immagine icona <span class="hint">(URL, opzionale: sostituisce l'emoji)</span></label><input id="fImage" type="url" placeholder="https://… oppure img/elevator.png"></div>
      <div class="field"><label for="fTagline">Frase breve <span class="hint">(sulla card, in inglese)</span></label><input id="fTagline" maxlength="90" placeholder="Move between floors in one jump."></div>
      <div class="field"><label for="fDesc">Descrizione completa <span class="hint">(tab Overview; riga vuota = nuovo paragrafo)</span></label><textarea id="fDesc" maxlength="2000" rows="4"></textarea></div>
      <div class="field"><label for="fFeat">Caratteristiche <span class="hint">(una per riga)</span></label><textarea id="fFeat"></textarea></div>
      <div class="field"><label for="fHow">Come si usa <span class="hint">(un passaggio per riga)</span></label><textarea id="fHow"></textarea></div>
      <div class="field"><label for="fGal">Galleria <span class="hint">(un URL immagine per riga, es. img/elevator-1.png)</span></label><textarea id="fGal"></textarea></div>
      <div class="field"><label for="fVideo">Video YouTube <span class="hint">(opzionale)</span></label><input id="fVideo" type="url" placeholder="https://youtu.be/…"></div>
      <div class="field"><label for="fLog">Changelog <span class="hint">(una per riga: 1.1: testo)</span></label><textarea id="fLog"></textarea></div>
      <div class="row">
        <div class="field"><label for="fMc">Versione Minecraft</label><input id="fMc" placeholder="1.21+"></div>
        <div class="field"><label for="fSize">Dimensione</label><input id="fSize" placeholder="240 KB"></div>
      </div>
      <div class="field"><label class="check"><input type="checkbox" id="fFree"> Addon gratis</label></div>
      <div class="row">
        <div class="field"><label for="fPrice">Prezzo (cubi = €)</label><input id="fPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="4.99"></div>
        <div class="field"><label for="fVer">Versione</label><input id="fVer" placeholder="1.0"></div>
      </div>
      <div class="row">
        <div class="field"><label for="fTag">Etichetta <span class="hint">(es. Nuovo)</span></label><input id="fTag" maxlength="16"></div>
        <div class="field"><label>Colore</label>
          <div class="colors" role="radiogroup" aria-label="Colore">
            <label><input type="radio" name="color" value="cyan" checked><span style="background:var(--cyan)" title="Ciano"></span></label>
            <label><input type="radio" name="color" value="violet"><span style="background:var(--violet)" title="Viola"></span></label>
            <label><input type="radio" name="color" value="magenta"><span style="background:var(--magenta)" title="Magenta"></span></label>
          </div>
        </div>
      </div>
      <div class="field"><label class="check"><input type="checkbox" id="fVisible" checked> Visibile sul sito</label></div>
      <div class="err" id="fErr" role="alert"></div>
      <div class="form-acts">
        <button class="btn" id="fSave">Aggiungi addon</button>
        <button class="btn ghost" type="button" id="fCancel" hidden>Annulla</button>
      </div>
    </form>

    <div>
      <div class="list-head">
        <h2>Addon</h2>
        <div class="stats" id="stats"></div>
      </div>
      <div class="items" id="items"><div class="panel empty">Caricamento…</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const _k = ["==QfiI1UChlS2skRzYULHJiOiQWS05WZtVmc1NXY", "l1mIsISM3cDM2Y2Y0IDOhRTZwkDOyU2MxEGM6IWZ", "3pDN4gjN0IjN5ITM0oTMiojIklEcwFmIsICN4gjN", "0IjN5ITM0IiOiQWSyVGZuV2Un5WanF2czVWbiwiI", "t92YuQ3bwNHcwFmLzQTZkVWL09mYvJnblVmcnJiO", "iQXZrNWdCV2ZhJ3b0NnIsIyM0UGZl1CdvJ2by5WZ", "lJ3ZiojIklEdjVmavJHciwiIwBXYuU2chJWY0FGZ", "lNXYiVmcpZmLxQ3cldXLlB3byVXZuIGZ0JXL0xWd", "hZWZk1yM0UGZl1CdvJ2by5WZlJ3Zv8iOzBHd0hmI", "6ICTSVVZzFmYhRXYkJCLi02bj5CcwFWZzFmYlJXa", "m5yM0UGZl1CdvJ2by5WZlJ3ZiojIulWYt9GRoRXd", "hJCLiUEZxZ2UHJTVJJGTkNWdEllT2FFZTxEMTJVe", "QdkQGFGUDl3UhpXSBJiOikXZLlGchJye"];
const firebaseConfig = JSON.parse(atob(_k.join("").split("").reverse().join("")));
const DB_PATH = "craftglitch/addons";
const R_PATH = "craftglitch/ratings";
let ratings = {};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro = n => Number(n).toLocaleString("it-IT", {style:"currency", currency:"EUR"});
const isFree = a => a.free || !Number(a.price);

const DEFAULTS = [
  {name:"Elevator", emoji:"🛗", color:"cyan", free:false, price:2.99, version:"1.0", mcVersion:"1.21+", size:"", tag:"",
   tagline:"Move between floors in one jump.",
   description:"Place an Elevator block on every floor of your base and travel between them instantly.\n\nJump to go up, sneak to go down. No ladders, no water columns.",
   features:["Floors at any height","Works in multiplayer","Craftable in survival"],
   howTo:["Craft the Elevator block","Place one on each floor, in the same column","Stand on it: jump to go up, sneak to go down"],
   gallery:[], video:"", changelog:["1.0: First release"]},
  {name:"PetChest", emoji:"🐾", color:"violet", free:true, price:0, version:"1.0", mcVersion:"1.21+", size:"", tag:"Free",
   tagline:"Your pet carries your loot.",
   description:"Give your tamed pet a chest. It follows you around and keeps your items safe.",
   features:["Extra inventory that follows you","Works with wolves, cats and horses","Items stay saved"],
   howTo:["Tame a pet","Use a chest on it","Interact with the pet to open its inventory"],
   gallery:[], video:"", changelog:["1.0: First release"]},
  {name:"Bot", emoji:"🤖", color:"magenta", free:false, price:4.99, version:"1.0", mcVersion:"1.21+", size:"", tag:"New",
   tagline:"A helper that works for you.",
   description:"Spawn a bot that follows you, protects you and helps around your world.",
   features:["Simple commands","Follows and defends you","Customizable"],
   howTo:["Craft the Bot spawn egg","Place it near you","Interact with it to give orders"],
   gallery:[], video:"", changelog:["1.0: First release"]},
  {name:"Teleport", emoji:"🌀", color:"violet", free:true, price:0, version:"1.0", mcVersion:"1.21+", size:"", tag:"",
   tagline:"Jump between your bases instantly.",
   description:"Create named teleport points and travel between your bases in a second.",
   features:["Named teleport points","Instant travel","Particle effects"],
   howTo:["Craft a Teleport pad","Place it and give it a name","Step on any pad and choose where to go"],
   gallery:[], video:"", changelog:["1.0: First release"]},
  {name:"AutoMiner", emoji:"⛏️", color:"cyan", free:false, price:3.99, version:"1.0", mcVersion:"1.21+", size:"", tag:"",
   tagline:"A machine that mines for you.",
   description:"Place the AutoMiner, give it fuel and let it dig. Every ore ends up in a chest.",
   features:["Mines a full area automatically","Collects drops into a chest","Stops when the chest is full"],
   howTo:["Craft the AutoMiner","Place it with a chest next to it","Add fuel and switch it on"],
   gallery:[], video:"", changelog:["1.0: First release"]}
];

let addons = [], editingId = null, unsub = null;

/* ---------- auth: il primo account creato diventa admin ---------- */
const ADMIN_PATH = "craftglitch/admin";
let adminUid, setupMode = false;

onValue(ref(db, ADMIN_PATH), snap => {
  adminUid = snap.val();
  setupMode = !adminUid;
  $("lTitle").textContent = setupMode ? "Crea l'account admin" : "Pannello addon";
  $("lSub").textContent = setupMode
    ? "Non c'è ancora un admin. Scegli email e password: questo account sarà l'unico a poter gestire il sito."
    : "Accedi per gestire addon e prezzi.";
  $("lPass2Wrap").hidden = !setupMode;
  $("lPass").autocomplete = setupMode ? "new-password" : "current-password";
  $("lBtn").textContent = setupMode ? "Crea account admin" : "Accedi";
  $("lForgot").hidden = setupMode;
  $("lBtn").disabled = false;
  checkUser(auth.currentUser);
}, () => {
  $("lSub").textContent = "Impossibile leggere il database. Controlla di aver incollato le regole in Firebase.";
});

const authMsg = c =>
  c.includes("email-already-in-use") ? "Questa email ha già un account. Usa un'altra email." :
  c.includes("weak-password") ? "Password troppo corta: almeno 6 caratteri." :
  c.includes("invalid-email") ? "Email non valida." :
  c.includes("operation-not-allowed") ? "Login Email/Password non attivo in Firebase (Authentication → Sign-in method)." :
  c.includes("too-many") ? "Troppi tentativi. Riprova tra qualche minuto." :
  c.includes("invalid") || c.includes("wrong") || c.includes("not-found") ? "Email o password errate." :
  "Operazione non riuscita: " + c;

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("lEmail").value.trim(), pass = $("lPass").value;
  $("lErr").textContent = "";
  if (setupMode && pass !== $("lPass2").value) { $("lErr").textContent = "Le password non coincidono."; return; }
  $("lBtn").disabled = true;
  try {
    if (setupMode){
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      try { await set(ref(db, ADMIN_PATH), cred.user.uid); }
      catch { await signOut(auth); throw {code: "claim"}; }
      toast("Account admin creato");
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (err) {
    $("lErr").textContent = err.code === "claim"
      ? "Account creato ma non registrato come admin: controlla le regole del database oppure qualcuno è già admin."
      : authMsg(err.code || "");
  } finally { $("lBtn").disabled = false; }
});
$("lForgot").addEventListener("click", async () => {
  const email = $("lEmail").value.trim();
  if (!email) { $("lErr").textContent = "Scrivi la tua email qui sopra, poi premi di nuovo."; $("lEmail").focus(); return; }
  try { await sendPasswordResetEmail(auth, email); $("lErr").textContent = ""; toast("Email per reimpostare la password inviata"); }
  catch (err) { $("lErr").textContent = authMsg(err.code || ""); }
});
$("logout").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, checkUser);
function checkUser(user){
  if (adminUid === undefined) return;           // aspetta di sapere chi è l'admin
  const ok = !!user && !user.isAnonymous && user.uid === adminUid;
  if (user && !user.isAnonymous && adminUid && !ok){
    signOut(auth);
    $("lErr").textContent = "Questo account non è l'admin del sito.";
    return;
  }
  $("login").style.display = ok ? "none" : "grid";
  $("app").style.display = ok ? "block" : "none";
  if (unsub) { unsub(); unsub = null; }
  if (!ok) return;
  $("who").textContent = user.email;
  unsub = onValue(ref(db, DB_PATH), snap => {
    const v = snap.val() || {};
    addons = Object.entries(v).map(([id, a]) => ({id, ...a}))
      .sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(b.name));
    renderList();
  }, err => toast("Lettura non riuscita: " + err.message, true));
  onValue(ref(db, R_PATH), snap => { ratings = snap.val() || {}; renderList(); });
}
function rstats(id){ const r = Object.values(ratings[id] || {}).map(x => +x.s).filter(Boolean); return {n: r.length, avg: r.length ? r.reduce((a,b)=>a+b,0)/r.length : 0}; }

/* ---------- lista ---------- */
function renderList(){
  const free = addons.filter(isFree).length;
  $("stats").innerHTML = `<span><b>${addons.length}</b> totali</span><span><b>${free}</b> gratis</span><span><b>${addons.length - free}</b> a pagamento</span>`;
  if (!addons.length){
    $("items").innerHTML = `<div class="panel empty"><strong>Nessun addon nel database.</strong>Aggiungine uno dal modulo, oppure carica i 5 addon di partenza e poi modificali.<br><button class="btn mag" id="seed">Carica Elevator, PetChest, Bot, Teleport, AutoMiner</button></div>`;
    $("seed").onclick = seed;
    return;
  }
  const colorVar = c => `var(--${c === "magenta" || c === "violet" ? c : "cyan"})`;
  $("items").innerHTML = addons.map((a, i) => `
    <div class="panel item ${a.visible === false ? "hidden" : ""} ${a.id === editingId ? "editing" : ""}" style="--c:${colorVar(a.color)}">
      <div class="ord">
        <button type="button" data-move="-1" data-i="${i}" aria-label="Sposta su" ${i === 0 ? "disabled" : ""}>▲</button>
        <button type="button" data-move="1" data-i="${i}" aria-label="Sposta giù" ${i === addons.length - 1 ? "disabled" : ""}>▼</button>
      </div>
      <div class="slot">${a.image ? `<img src="${esc(a.image)}" alt="">` : esc(a.emoji || "🧩")}</div>
      <div><h3>${esc(a.name)}</h3>
        <div class="meta">${a.version ? `<span>v${esc(a.version)}</span>` : ""}${a.tag ? `<span class="pill">${esc(a.tag)}</span>` : ""}${a.visible === false ? "<span>Nascosto</span>" : ""}<span>❤ ${rstats(a.id).n ? rstats(a.id).avg.toFixed(1) + " (" + rstats(a.id).n + " voti)" : "nessun voto"}</span></div></div>
      <div class="price ${isFree(a) ? "free" : ""}">${isFree(a) ? "Gratis" : euro(a.price)}</div>
      <div class="acts">
        <button class="btn ghost sm" type="button" data-edit="${esc(a.id)}">Modifica</button>
        ${rstats(a.id).n ? `<button class="btn ghost sm" type="button" data-reset="${esc(a.id)}">Azzera voti</button>` : ""}
        <button class="btn danger sm" type="button" data-del="${esc(a.id)}">Elimina</button>
      </div>
    </div>`).join("");
}

$("items").addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.edit) startEdit(t.dataset.edit);
  if (t.dataset.del){
    const a = addons.find(x => x.id === t.dataset.del);
    if (!confirm(`Eliminare "${a.name}"? Non si può annullare.`)) return;
    try { await remove(ref(db, `${DB_PATH}/${a.id}`)); await remove(ref(db, `${R_PATH}/${a.id}`)).catch(() => {}); if (editingId === a.id) resetForm(); toast(`"${a.name}" eliminato`); }
    catch (err) { toast(permMsg(err), true); }
  }
  if (t.dataset.reset){
    const a = addons.find(x => x.id === t.dataset.reset);
    if (!confirm(`Azzerare tutti i voti di "${a.name}"?`)) return;
    try { await remove(ref(db, `${R_PATH}/${a.id}`)); toast("Voti azzerati"); } catch (err) { toast(permMsg(err), true); }
  }
  if (t.dataset.move){
    const i = +t.dataset.i, j = i + +t.dataset.move;
    const arr = [...addons]; [arr[i], arr[j]] = [arr[j], arr[i]];
    const upd = {}; arr.forEach((a, k) => upd[`${a.id}/order`] = k);
    try { await update(ref(db, DB_PATH), upd); } catch (err) { toast(permMsg(err), true); }
  }
});

async function seed(){
  try {
    const upd = {};
    DEFAULTS.forEach((d, i) => { upd[push(ref(db, DB_PATH)).key] = {...d, visible:true, order:i, updatedAt:Date.now()}; });
    await update(ref(db, DB_PATH), upd);
    toast("Addon di partenza caricati");
  } catch (err) { toast(permMsg(err), true); }
}

/* ---------- form ---------- */
const syncPrice = () => { $("fPrice").disabled = $("fFree").checked; if ($("fFree").checked) $("fPrice").value = ""; };
$("fFree").addEventListener("change", syncPrice);

function startEdit(id){
  const a = addons.find(x => x.id === id); if (!a) return;
  editingId = id;
  $("fName").value = a.name || ""; $("fEmoji").value = a.emoji || ""; $("fImage").value = a.image || "";
  $("fDesc").value = a.description || ""; $("fFeat").value = (a.features || []).join("\n");
  $("fTagline").value = a.tagline || ""; $("fHow").value = (a.howTo || []).join("\n");
  $("fGal").value = (a.gallery || []).join("\n"); $("fVideo").value = a.video || "";
  $("fLog").value = (a.changelog || []).join("\n"); $("fMc").value = a.mcVersion || ""; $("fSize").value = a.size || "";
  $("fFree").checked = isFree(a); $("fPrice").value = isFree(a) ? "" : a.price;
  $("fVer").value = a.version || ""; $("fTag").value = a.tag || "";
  $("fVisible").checked = a.visible !== false;
  (document.querySelector(`input[name=color][value="${a.color}"]`) || document.querySelector("input[name=color]")).checked = true;
  syncPrice();
  $("formTitle").textContent = `Modifica ${a.name}`;
  $("fSave").textContent = "Salva modifiche";
  $("fCancel").hidden = false; $("fErr").textContent = "";
  renderList();
  $("form").scrollIntoView({behavior:"smooth", block:"start"});
  $("fName").focus({preventScroll:true});
}
function resetForm(){
  editingId = null; $("form").reset(); syncPrice();
  $("formTitle").textContent = "Nuovo addon"; $("fSave").textContent = "Aggiungi addon";
  $("fCancel").hidden = true; $("fErr").textContent = "";
  renderList();
}
$("fCancel").addEventListener("click", resetForm);

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("fName").value.trim();
  const free = $("fFree").checked;
  const price = Math.round(parseFloat(String($("fPrice").value).replace(",", ".")) * 100) / 100;
  if (!name) return fail("Inserisci il nome dell'addon.", "fName");
  if (!free && !(price > 0)) return fail("Inserisci un prezzo maggiore di 0, oppure segna l'addon come gratis.", "fPrice");
  const data = {
    name,
    emoji: $("fEmoji").value.trim() || "🧩",
    image: $("fImage").value.trim(),
    description: $("fDesc").value.trim(),
    tagline: $("fTagline").value.trim(),
    features: lines("fFeat"), howTo: lines("fHow"), gallery: lines("fGal"), changelog: lines("fLog"),
    video: $("fVideo").value.trim(), mcVersion: $("fMc").value.trim(), size: $("fSize").value.trim(),
    free, price: free ? 0 : price,
    version: $("fVer").value.trim(),
    tag: $("fTag").value.trim(),
    color: document.querySelector("input[name=color]:checked").value,
    visible: $("fVisible").checked,
    updatedAt: Date.now()
  };
  $("fSave").disabled = true;
  try {
    if (editingId){
      await update(ref(db, `${DB_PATH}/${editingId}`), data);
      toast(`"${name}" salvato`);
    } else {
      data.order = addons.length ? Math.max(...addons.map(a => a.order ?? 0)) + 1 : 0;
      await set(push(ref(db, DB_PATH)), data);
      toast(`"${name}" aggiunto`);
    }
    resetForm();
  } catch (err) { fail(permMsg(err)); }
  finally { $("fSave").disabled = false; }
});
const lines = id => $(id).value.split("\n").map(s => s.trim()).filter(Boolean);
function fail(msg, focusId){ $("fErr").textContent = msg; if (focusId) $(focusId).focus(); }
function permMsg(err){
  return String(err?.message || err).toLowerCase().includes("permission")
    ? "Permesso negato: controlla di aver incollato le regole del database in Firebase."
    : "Errore: " + (err?.message || err);
}
function toast(msg, bad){
  const t = $("toast"); t.textContent = msg; t.classList.toggle("bad", !!bad); t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}
</script>
</body>
